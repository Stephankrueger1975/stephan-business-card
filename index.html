<meta name="description" content="Digitale Visitenkarte von Stephan Krueger, Director Origination bei Freepoint Eco-Systems.">
<style>
:root{--ink:#073d46;--teal:#00636b;--green:#00a96e;--mint:#73d6b4;--paper:#fff;--soft:#f2f7f6;--line:#dce9e7;--shadow:0 20px 55px rgba(0,56,64,.14)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(150deg,#eef7f4 0,#f7faf9 48%,#eaf5f2 100%);color:#18373b;min-height:100vh}
.shell{width:min(100%,760px);margin:auto;padding:28px 18px 42px} .card{background:var(--paper);border:1px solid rgba(0,99,107,.10);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.brand{padding:26px 28px 22px;border-bottom:1px solid var(--line)} .brand img{display:block;width:min(100%,430px);height:auto}
.hero{display:grid;grid-template-columns:156px 1fr;gap:26px;align-items:center;padding:30px 28px 24px}
.photo{width:156px;height:156px;border-radius:50%;object-fit:cover;object-position:center center;border:5px solid #fff;box-shadow:0 8px 28px rgba(0,75,82,.20);outline:2px solid #dceee9}
h1{font-size:clamp(30px,6vw,44px);line-height:1.02;margin:0 0 8px;color:var(--ink);letter-spacing:-.035em} .role{font-size:18px;font-weight:650;color:var(--teal);margin:0 0 7px} .company{font-size:15px;color:#577174;margin:0}
.actions{display:grid;grid-template-columns:1fr;gap:12px;padding:0 28px 28px} .btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px;border-radius:14px;text-decoration:none;font-weight:750;font-size:15px;border:1px solid var(--line);color:var(--ink);background:#fff}
.btn.primary{grid-column:auto;background:linear-gradient(120deg,var(--teal),#007d75);color:#fff;border:0;box-shadow:0 10px 24px rgba(0,99,107,.22)}
.details{background:var(--soft);padding:24px 28px 30px;border-top:1px solid var(--line)} .row{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid #dce9e7} .row:last-child{border-bottom:0} .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#789092} .value,.value a{font-size:15px;color:#173f45;text-decoration:none;overflow-wrap:anywhere} .value a:hover{text-decoration:underline}
.footer{text-align:center;color:#789092;font-size:12px;padding:20px 20px 0}
@media(max-width:560px){.shell{padding:0} .card{border-radius:0;min-height:100vh} .brand{padding:22px 22px 18px} .hero{grid-template-columns:112px 1fr;gap:18px;padding:25px 22px 22px} .photo{width:112px;height:112px} h1{font-size:30px} .role{font-size:16px} .actions{padding:0 22px 24px;grid-template-columns:1fr} .btn.primary{grid-column:auto} .details{padding:20px 22px 28px} .row{grid-template-columns:1fr;gap:4px}}
</style></head>
